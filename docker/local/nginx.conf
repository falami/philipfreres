# Only this proxy joins a network with host port publishing.
# Application, MySQL and mail services remain on the internal network.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 80;
    client_max_body_size 128m;
    location / {
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
        set $app_backend app:80;
        proxy_pass http://$app_backend;
    }
}
server {
    listen 8025;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        set $mail_backend mailpit:8025;
        proxy_pass http://$mail_backend;
    }
}
server {
    listen 8080;
    client_max_body_size 512m;
    location / {
        proxy_set_header Host $http_host;
        proxy_read_timeout 600s;
        set $database_ui phpmyadmin:80;
        proxy_pass http://$database_ui;
    }
}
