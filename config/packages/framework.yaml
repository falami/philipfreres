# see https://symfony.com/doc/current/reference/configuration/framework.html

framework:
  secret: "%env(APP_SECRET)%"
  default_locale: fr
  translator:
    default_path: "%kernel.project_dir%/translations"
    fallbacks: [fr]

  router:
    default_uri: "https://app.philipfreres.com"

  session:
    name: PHILIPFRERESSESSIDV2
    handler_id: session.handler.native_file
    save_path: '%kernel.project_dir%/var/sessions/%kernel.environment%'
    cookie_secure: auto
    cookie_httponly: true
    cookie_samesite: lax
    cookie_lifetime: 0 # La persistance facultative est portée par remember_me, après le code.
    gc_maxlifetime: 86400 # 24h

when@test:
  framework:
    test: true
    session:
      storage_factory_id: session.storage.factory.mock_file

when@prod:
  framework:
    trusted_hosts: ['^app\.philipfreres\.com$']
    session:
      cookie_secure: true
